method: probed
source: live unauthenticated HTTP probes with a browser User-Agent, 2026-09-06
note: >-
  www.eeoc.gov and eeoc.gov return HTTP 403 for the ENTIRE /.well-known/ namespace —
  including paths that do not exist (/.well-known/zzz-does-not-exist also 403s, and
  /.well-known/ itself 403s). This is a blanket server-side deny, not a missing file,
  so EEOC currently cannot serve an RFC 9116 security.txt, an RFC 9727 api-catalog or
  an A2A agent card from its primary domain without a web-server configuration change.
  That is a one-line fix on the provider's side and would unlock several discovery
  surfaces at once.
