# EEOC Project Open Data / DCAT-US data catalog — the only first-party
# machine-readable document this pipeline could find on any EEOC-controlled host.
generated: '2026-09-06'
method: probed
source: https://www.eeoc.gov/data.json
name: EEOC Public Data Listing (data.json)
description: >-
  The U.S. Equal Employment Opportunity Commission publishes a Project Open Data
  v1.1 / DCAT-US "public data listing" at https://www.eeoc.gov/data.json, as required
  of federal agencies by OMB M-13-13. It is a dcat:Catalog of 140 dataset records
  covering the EEO-1, EEO-3, EEO-4 and EEO-5 workforce demographic collections. It is
  a DATA catalog, not an API catalog — every distribution is a file download
  (XLSX / CSV / ZIP) or an HTML landing page, and no entry names an API endpoint.
