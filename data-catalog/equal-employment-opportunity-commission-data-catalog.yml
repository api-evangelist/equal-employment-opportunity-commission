findings:
  - id: no-api-distribution
    finding: >-
      Not one of the 140 datasets carries an API distribution. Every distribution is a
      downloadURL to a spreadsheet, CSV or ZIP on www.eeoc.gov, or an HTML landing page.
      Programmatic consumers must scrape or bulk-download files.
  - id: catalog-is-stale
    finding: >-
      The newest dataset `modified` date in the catalog is 2019-08-19; the distribution
      is a 2013-2019 cohort. Meanwhile the EEO-1 statistics page on the same site links
      public-use files through EEO1_2023_PUF.xlsx (uploaded 2025-05). The federally
      mandated machine-readable listing has drifted roughly six years behind the human
      pages it is supposed to describe.
  - id: api-commitment-unshipped
    finding: >-
      The EEOC Open Government Plan commits to describing "ways in which EEOC is making
      public data assets available for download and/or use through an application
      programming interface (API)". No such API exists on any EEOC-controlled host as of
      this probe.
    evidence: https://www.eeoc.gov/us-equal-employment-opportunity-commission-eeoc-open-government-plan
